*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:242px;background:var(--navy);color:#dbeafe;padding:24px 15px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.brand-icon{height:42px;width:42px;border-radius:13px;background:#2e4b8c;display:grid;place-items:center;font-size:22px;color:white}.brand strong{display:block;color:white;font-size:17px;letter-spacing:.1px}.brand small{display:block;color:#a9b9df;font-size:11px;margin-top:3px}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#8195c2;padding:9px 13px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#bdcbea;text-align:left;padding:12px 13px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}.nav button .ico{width:19px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#2a4075;color:white}.sidebar-foot{margin-top:auto;border-top:1px solid #2e4070;padding:17px 11px 0;font-size:11px;color:#9fb0d7;line-height:1.7}.main{margin-left:242px;width:calc(100% - 242px);min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px;position:sticky;top:0;z-index:4}.page-label{font-weight:750;font-size:17px;color:#182a4f}.top-right{display:flex;align-items:center;gap:16px}.search-wrap{position:relative}.search-wrap span{position:absolute;left:13px;top:10px;color:#8793a8}.search-wrap input{width:240px;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:10px;background:#fafcff;font-size:12px;outline:none}.search-wrap input:focus,input:focus,select:focus,textarea:focus{border- in:8px 0 0}.primary{border:0;border-radius:10px;background:var(--blue);color:white;padding:12px 16px;font-weight:700;font-size:12px;box-shadow:0 4px 10px #2563eb24;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary:hover{background:#1d4ed8;transform:translateY(-1px)}.secondary{border:1px solid var(--border);border-radius:9px;background:white;color:#35445e;padding:10px 13px;font-size:12px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:24px}.stat{background:white;border:1px solid var(--border);border-radius:15px;padding:21px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat-top{display:flex;align-items:center;justify-content:space-between;color:#718096;font-size:12px;font-weight:650}.stat-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:19px}.stat-num{font-size:31px;letter-spacing:-1px;font-weight:800;margin-top:15px;color:#1b2b4d}.stat-foot{font-size:11px;color:#8b97a9;margin-top:4px}.panel{background:white;border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}.panel-head{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f5}.panel-head h2{font-size:15px;margin:0;color:#1b2b4d}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.text-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:750}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}thead{background:#f8faff}th{font-size:10px;text-transform:uppercase;letter-spacing:.65px;color:#8190a6;text-align:left;padding:13px 17px;font-weight:800}td{padding:15px 17px;border-top:1px solid #eef1f6;font-size:12px;color:#526078}tbody tr:hover{background:#fbfdff}.id{color:#2756a6;font-weight:800}.room{font-weight:700;color:#263652}.category-cell{display:flex;align-items:center;gap:8px}.cat-icon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:#eff6ff;font-size:14px}.desc-title{font-weight:700;color:#2b3850}.desc-sub{font-size:10px;color:#8b97a9;margin-top:4px;max-width:180px;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:30px;font-size:10px;font-weight:800}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.pending{background:var(--amber-bg);color:var(--amber)}.progress{background:var(--sky-bg);color:var(--sky)}.resolved{background:var(--green-bg);color:var(--green)}.table-action{border:1px solid var(--border);background:white;border-radius:7px;padding:6px 9px;color:#526078;font-size:11px}.empty{padding:38px;text-align:center;color:#8793a8;font-size:13px}.empty strong{display:block;color:#34445f;font-size:14px;margin-bottom:6px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.quick-card{background:white;border:1px solid var(--border);border-radius:14px;padding:19px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;box-shadow:var(--shadow)}.quick-card:hover{border-color:#b7ccf9;background:#fcfdff}.quick-icon{width:43px;height:43px;border-radius:12px;background:#eff6ff;display:grid;place-items:center;color:#2563eb;font-size:20px}.quick-card strong{display:block;font-size:13px;color:#273753}.quick-card small{display:block;color:#8190a6;font-size:11px;margin-top:5px}.quick-arrow{margin-left:auto;color:#91a0b5}.page-title{margin-bottom:22px}.page-title h1{font-size:25px;margin:0;color:#15264a;letter-spacing:-.5px}.page-title p{font-size:13px;color:var(--muted);margin:7px 0 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--border);border-radius:9px;background:white;padding:10px 12px;color:#43516a;font-size:12px;outline:none}.toolbar input{min-width:210px}.form-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(230px,.8fr);gap:20px;align-items:start}.form-card{background:white;border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:25px}.form-card h2{font-size:16px;margin:0;color:#1b2b4d}.form-card .intro{font-size:12px;color:#8490a3;margin:7px 0 22px;line-height:1.6}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.field label{font-size:11px;font-weight:800;color:#43516a}.field label span{color:#e05252}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe5ee;border-radius:9px;background:#fff;color:#26354e;font-size:12px;outline:none}.field textarea{min-height:115px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:#a4adbb}.form-actions{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid #edf0f5;padding-top:18px;margin-top:2px}.info-card{background:#edf4ff;border:1px solid #d8e7ff;border-radius:15px;padding:21px}.info-card h3{margin:0;color:#1b3d78;font-size:14px}.info-card p{font-size:12px;line-height:1.7;color:#54709c}.tip{display:flex;gap:10px;margin-top:18px;color:#45628f;font-size:11px;line-height:1.6}.tip span{font-size:17px}.toast{position:fixed;right:25px;bottom:25px;background:#172554;color:white;padding:14px 18px;border-radius:11px;box-shadow:0 10px 35px #0f172a33;font-size:12px;z-index:20;max-width:340px;animation:slide .2s ease}.toast.error{background:#991b1b}@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.mobile-menu{display:none}.muted{color:#8490a3}.detail-row{display:flex;gap:8px;align-items:center}.footer-note{text-align:center;color:#9aa5b5;font-size:10px;padding:14px}
@media(max-width:1050px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.content{padding:25px 23px}.topbar{padding:0 23px}.search-wrap input{width:195px}.form-layout{grid-template-columns:1fr}.info-card{order:-1}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:250px}.sidebar.open{transform:translateX(0);box-shadow:12px 0 40px #17255425}.main{margin-left:0;width:100%}.topbar{height:65px;padding:0 16px}.mobile-menu{display:inline-grid;place-items:center;border:1px solid var(--border);background:white;width:36px;height:36px;border-radius:9px;color:#34445f}.topbar-left{display:flex;align-items:center;gap:11px}.page-label{font-size:15px}.top-right{gap:8px}.search-wrap{display:none}.icon-button{width:34px;height:34px}.avatar{width:33px;height:33px}.content{padding:23px 15px 35px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:23px}.stats{gap:9px}.stat{padding:13px 11px;border-radius:12px}.stat-top{font-size:10px;align-items:flex-start;gap:5px;flex-direction:column-reverse}.stat-icon{width:30px;height:30px;font-size:15px}.stat-num{font-size:25px;margin-top:10px}.stat-foot{font-size:9px}.panel-head{padding:17px}.quick-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr;gap:0}.form-card{padding:19px}.toolbar{align-items:stretch}.toolbar input,.toolbar select{width:100%;min-width:0}.toolbar .primary{width:100%}.page-title h1{font-size:23px}.toast{left:15px;right:15px;bottom:15px}.table-wrap table{min-width:780px}}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">⌂</div><div><strong>HostelCare</strong><small>MAINTENANCE PORTAL</small></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav">
      <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
      <button data-page="complaints"><span class="ico">☷</span> All Complaints</button>
      <button data-page="raise"><span class="ico">＋</span> Raise Complaint</button>
    </nav>
    <div class="sidebar-foot">Hostel Maintenance System<br><span>Simple • Reliable • Student-friendly</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left"><button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><div class="page-label" id="topTitle">Dashboard Overview</div></div>
      <div class="top-right">
        <div class="search-wrap"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search complaint ID or room..."></div>
        <button class="icon-button" id="notificationBtn" aria-label="Notifications">♧</button>
        <div class="profile-wrap"><button class="avatar" id="profileButton" aria-label="Open profile menu" aria-expanded="false">S</button><div class="profile-menu" id="profileMenu"><div class="profile-heading"><strong id="profileName">Student Demo</strong><small id="profileRole">Student view</small></div><button id="studentViewButton" class="selected">▣ &nbsp; Student view</button><button id="wardenViewButton">▦ &nbsp; Warden / Admin view</button><button id="resetDemoButton">↻ &nbsp; Reset demo data</button></div></div>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div id="toastArea" aria-live="polite"></div>
<script>
const KEY='hostelcare_complaints_v1';
const initial=[
 {id:'HC-1001',room:'204',category:'Plumbing',title:'Bathroom tap leakage',description:'Water is leaking continuously from the bathroom tap.',date:'2026-10-07',status:'Pending'},
 {id:'HC-1002',room:'108',category:'Electrical',title:'Room light not working',description:'The main light is flickering and sometimes turns off.',date:'2026-10-06',status:'In Progress'},
 {id:'HC-1003',room:'312',category:'Furniture',title:'Broken study chair',description:'One leg of the study chair is loose.',date:'2026-10-05',status:'Resolved'},
 {id:'HC-1004',room:'221',category:'Cleaning',title:'Common area cleaning',description:'The corridor near the room needs cleaning.',date:'2026-10-04',status:'Pending'},
 {id:'HC-1005',room:'115',category:'Plumbing',title:'Wash basin drain blocked',description:'Water is draining very slowly from the wash basin.',date:'2026-10-03',status:'Resolved'}
];
let complaints=loadData(),page='dashboard',role='student',filters={search:'',status:'All Statuses',category:'All Categories'};
const SAMPLE_IDS=new Set(['HC-1001','HC-1002','HC-1003','HC-1004','HC-1005']);
function loadData(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:initial.slice()}catch{return initial.slice()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(complaints))}catch{}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function statusClass(s){return s==='Resolved'?'resolved':s==='In Progress'?'progress':'pending'}
function catIcon(c){return ({Plumbing:'♧',Electrical:'ϟ',Cleaning:'✦',Furniture:'▤',Other:'◈'})[c]||'◈'}
function counts(){return {total:complaints.length,pending:complaints.filter(c=>c.status==='Pending').length,progress:complaints.filter(c=>c.status==='In Progress').length,resolved:complaints.filter(c=>c.status==='Resolved').length}}
function toast(msg,error=false){const area=document.getElementById('toastArea');area.innerHTML=`<div class="toast ${error?'error':''}">${error?'⚠':'✓'} &nbsp;${esc(msg)}</div>`;setTimeout(()=>{area.innerHTML=''},3200)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=({dashboard:'Dashboard Overview',complaints:'All Complaints',raise:'Raise a Complaint'})[p];document.getElementById('sidebar').classList.remove('open');render()}
function statCard(title,num,icon,bg,fg,foot){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}
function tableRows(list){if(!list.length)return `<tr><td colspan="7"><div class="empty"><strong>No complaints found</strong>Try changing your search or filters.</div></td></tr>`;return list.map(c=>`<tr><td><span class="id">${esc(c.id)}</span></td><td><span class="room">Room ${esc(c.room)}</span></td><td><div class="category-cell"><span class="cat-icon">${catIcon(c.category)}</span>${esc(c.category)}</div></td><td><div class="desc-title">${esc(c.title)}</div><div class="desc-sub">${esc(c.description)}</div></td><td>${dateFmt(c.date)}</td><td><select class="status-select" data-status-id="${esc(c.id)}" aria-label="Update status for ${esc(c.id)}" style="border:0;border-radius:20px;padding:6px 8px;font-size:10px;font-weight:800;background:${c.status==='Resolved'?'#dcfce7':c.status==='In Progress'?'#dbeafe':'#fef3c7'};color:${c.status==='Resolved'?'#15803d':c.status==='In Progress'?'#1d4ed8':'#b45309'}"><option ${c.status==='Pending'?'selected':''}>Pending</option><option ${c.status==='In Progress'?'selected':''}>In Progress</option><option ${c.status==='Resolved'?'selected':''}>Resolved</option></select></td><td><div class="table-actions"><button class="table-action" data-view-id="${esc(c.id)}">View</button>${c.status==='Resolved'?`<button class="danger" data-delete-id="${esc(c.id)}" title="Remove resolved complaint">Remove</button>`:''}</div></td></tr>`).join('')}
function complaintTable(list){return `<div class="table-wrap"><table><thead><tr><th>Complaint ID</th><th>Room</th><th>Category</th><th>Complaint Details</th><th>Date Raised</th><th>Status</th><th>Action</th></tr></thead><tbody>${tableRows(list)}</tbody></table></div>`}
function dashboard(){const c=counts(),recent=[...complaints].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${role==='warden'?'<div class="role-banner"><strong>Warden / Admin view</strong><span>Review all hostel requests, update their status, and remove resolved demo records.</span></div>':''}<div class="welcome"><div><div class="eyebrow">${role==='warden'?'HOSTEL ADMINISTRATION':'STUDENT WORKSPACE'}</div><h1>${role==='warden'?'Maintenance Overview':'Good morning, Student'} <span style="font-size:23px">✦</span></h1><p>${role==='warden'?'Monitor and manage maintenance requests submitted by hostel residents.':'Manage and track your hostel maintenance requests.'}</p></div>${role==='warden'?'<button class="primary" data-go="complaints">☷ &nbsp; Manage Complaints</button>':'<button class="primary" data-go="raise">＋ &nbsp; Raise New Complaint</button>'}</div><div class="stats">${statCard('Total Complaints',c.total,'▤','#eff6ff','#2563eb','All requests submitted')}${statCard('Pending Complaints',c.pending,'◷','#fffbeb','#d97706','Awaiting attention')}${statCard('Resolved Complaints',c.resolved,'✓','#f0fdf4','#16a34a','Successfully completed')}</div><div class="panel"><div class="panel-head"><div><h2>Recent Complaints</h2><p>Latest maintenance requests from your hostel</p></div><button class="text-link" data-go="complaints">View all complaints&nbsp; →</button></div>${complaintTable(recent)}</div><div class="panel-head" style="padding:7px 0 14px;border:0"><div><h2 style="font-size:15px">Quick Actions</h2><p>Common tasks, right at your fingertips</p></div></div><div class="quick-grid"><button class="quick-card" data-go="raise"><span class="quick-icon">＋</span><span><strong>Raise a complaint</strong><small>Report a maintenance issue in your room</small></span><span class="quick-arrow">→</span></button><button class="quick-card" data-go="complaints"><span class="quick-icon">☷</span><span><strong>Track complaints</strong><small>Review status and see recent updates</small></span><span class="quick-arrow">→</span></button></div><div class="footer-note">HostelCare · Hostel Maintenance Portal</div>`}
function filtered(){const q=filters.search.trim().toLowerCase();return [...complaints].filter(c=>(!q||[c.id,c.room,c.category,c.title,c.description].some(v=>String(v).toLowerCase().includes(q)))&&(filters.status==='All Statuses'||c.status===filters.status)&&(filters.category==='All Categories'||c.category===filters.category)).sort((a,b)=>b.date.localeCompare(a.date))}
function complaintsPage(){return `<div class="page-title"><div class="eyebrow">${role==='warden'?'WARDEN WORKSPACE':'REQUEST MANAGEMENT'}</div><h1>${role==='warden'?'Manage Hostel Complaints':'All Complaints'}</h1><p>${role==='warden'?'Review requests from residents and keep complaint statuses up to date.':'Search, review, and track hostel maintenance requests.'}</p></div>${role==='warden'?'<div class="role-banner"><strong>Warden tools</strong><span>Change status using the dropdown. Resolved complaints can be removed from this demo list.</span></div>':''}<div class="panel"><div class="panel-head"><div><h2>Complaint Records</h2><p>${complaints.length} total records</p></div><div class="toolbar"><button class="secondary" id="clearSamplesButton">Clear sample complaints</button>${role==='student'?'<button class="primary" data-go="raise">＋ Raise Complaint</button>':''}</div></div><div class="panel-head" style="border-bottom:0;padding-bottom:17px"><div class="toolbar" style="width:100%"><input id="tableSearch" value="${esc(filters.search)}" placeholder="Search ID, room or keyword..." aria-label="Search complaints"><select id="statusFilter" aria-label="Filter by status"><option>All Statuses</option><option ${filters.status==='Pending'?'selected':''}>Pending</option><option ${filters.status==='In Progress'?'selected':''}>In Progress</option><option ${filters.status==='Resolved'?'selected':''}>Resolved</option></select><select id="categoryFilter" aria-label="Filter by category"><option>All Categories</option>${['Electrical','Plumbing','Cleaning','Furniture','Other'].map(x=>`<option ${filters.category===x?'selected':''}>${x}</option>`).join('')}</select><button class="secondary" id="clearFilters">Clear filters</button></div></div><div id="complaintResults">${complaintTable(filtered())}</div></div><div class="archive-note">Resolved complaints stay in the list for record-keeping. Use Remove on a resolved row to delete it from this browser demo. Clear sample complaints removes only the five starter records.</div><div class="footer-note">Tip: use the status dropdown in a row to update a complaint.</div>`}
function raisePage(){return `<div class="page-title"><div class="eyebrow">NEW MAINTENANCE REQUEST</div><h1>Raise a Complaint</h1><p>Tell us what needs attention. We'll add it to your complaint tracker.</p></div><div class="form-layout"><div class="form-card"><h2>Complaint details</h2><p class="intro">Please provide accurate details so the maintenance team can identify and resolve the issue.</p><form id="complaintForm"><div class="field-grid"><div class="field"><label for="room">Room number <span>*</span></label><input id="room" name="room" placeholder="e.g. 204" maxlength="12" required></div><div class="field"><label for="category">Complaint category <span>*</span></label><select id="category" name="category" required><option value="">Select a category</option><option>Electrical</option><option>Plumbing</option><option>Cleaning</option><option>Furniture</option><option>Other</option></select></div></div><div class="field"><label for="title">Complaint title <span>*</span></label><input id="title" name="title" placeholder="Briefly describe the issue" maxlength="70" required></div><div class="field"><label for="description">Description <span>*</span></label><textarea id="description" name="description" placeholder="Add details about the issue and where it occurs..." maxlength="500" required></textarea></div><div class="form-actions"><button type="button" class="secondary" data-go="dashboard">Cancel</button><button class="primary" type="submit">Submit Complaint&nbsp; →</button></div></form></div><aside class="info-card"><div style="font-size:25px;margin-bottom:13px">ⓘ</div><h3>Before you submit</h3><p>Include the room number and choose the closest category. A clear description helps the maintenance team understand the problem.</p><div class="tip"><span>✓</span><span><strong>Track your request</strong><br>Your complaint receives a unique ID that you can search later.</span></div><div class="tip"><span>◷</span><span><strong>Status updates</strong><br>Requests start as Pending and can move to In Progress or Resolved.</span></div><div class="tip"><span>⌂</span><span><strong>Keep it accurate</strong><br>Submit one complaint per maintenance issue.</span></div></aside></div><div class="footer-note">Your complaint details are saved in this browser for demo purposes.</div>`}
function render(){const el=document.getElementById('content');el.innerHTML=page==='dashboard'?dashboard():page==='complaints'?complaintsPage():raisePage();bindPage();document.getElementById('globalSearch').value=filters.search}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelectorAll('[data-view-id]').forEach(b=>b.addEventListener('click',()=>{const c=complaints.find(x=>x.id===b.dataset.viewId);if(c)toast(`${c.id} · Room ${c.room} · ${c.title} · ${c.status}`)}));
document.querySelectorAll('[data-delete-id]').forEach(b=>b.addEventListener('click',()=>{const c=complaints.find(x=>x.id===b.dataset.deleteId);if(!c||c.status!=='Resolved'){toast('Only resolved complaints can be removed.',true);return}if(confirm(`Remove resolved complaint ${c.id} from this browser demo? This cannot be undone.`)){complaints=complaints.filter(x=>x.id!==c.id);save();render();toast(`${c.id} removed from the demo list.`)}}));
const clearSamples=document.getElementById('clearSamplesButton');if(clearSamples)clearSamples.addEventListener('click',()=>{const sampleCount=complaints.filter(c=>SAMPLE_IDS.has(c.id)).length;if(!sampleCount){toast('No starter sample complaints remain.');return}if(confirm(`Remove ${sampleCount} starter sample complaints? Complaints you added yourself will stay.`)){complaints=complaints.filter(c=>!SAMPLE_IDS.has(c.id));save();render();toast('Starter sample complaints removed.')}});document.querySelectorAll('[data-status-id]').forEach(s=>s.addEventListener('change',()=>{const c=complaints.find(x=>x.id===s.dataset.statusId);if(c){c.status=s.value;save();render();toast(`${c.id} status updated to ${c.status}`)}}));const form=document.getElementById('complaintForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form),room=String(fd.get('room')).trim(),category=String(fd.get('category')),title=String(fd.get('title')).trim(),description=String(fd.get('description')).trim();if(!room||!category||!title||!description){toast('Please complete all required fields.',true);return}if(!/^[A-Za-z0-9-]+$/.test(room)){toast('Use a valid room number (letters, numbers, or hyphens).',true);return}const nums=complaints.map(c=>parseInt(c.id.replace(/\D/g,''),10)).filter(Number.isFinite);const next=Math.max(1000,...nums)+1;complaints.unshift({id:`HC-${next}`,room,category,title,description,date:new Date().toISOString().slice(0,10),status:'Pending'});save();filters.search='';filters.status='All Statuses';filters.category='All Categories';go('complaints');toast(`Complaint HC-${next} submitted successfully.`)});const ts=document.getElementById('tableSearch');if(ts)ts.addEventListener('input',()=>{filters.search=ts.value;updateTableOnly()});const sf=document.getElementById('statusFilter');if(sf)sf.addEventListener('change',()=>{filters.status=sf.value;updateTableOnly()});const cf=document.getElementById('categoryFilter');if(cf)cf.addEventListener('change',()=>{filters.category=cf.value;updateTableOnly()});const clear=document.getElementById('clearFilters');if(clear)clear.addEventListener('click',()=>{filters={search:'',status:'All Statuses',category:'All Categories'};render()})}
function updateTableOnly(){const r=document.getElementById('complaintResults');if(r){r.innerHTML=complaintTable(filtered());r.querySelectorAll('[data-view-id]').forEach(b=>b.addEventListener('click',()=>{const c=complaints.find(x=>x.id===b.dataset.viewId);if(c)toast(`${c.id} · Room ${c.room} · ${c.title} · ${c.status}`)}));r.querySelectorAll('[data-status-id]').forEach(s=>s.addEventListener('change',()=>{const c=complaints.find(x=>x.id===s.dataset.statusId);if(c){c.status=s.value;save();render();toast(`${c.id} status updated to ${c.status}`)}}))}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('globalSearch').addEventListener('input',e=>{filters.search=e.target.value;if(page!=='complaints')go('complaints');else{const ts=document.getElementById('tableSearch');if(ts)ts.value=filters.search;updateTableOnly()}});
document.getElementById('notificationBtn').addEventListener('click',()=>toast(`${counts().pending} complaint(s) currently pending.`));
const profileButton=document.getElementById('profileButton'),profileMenu=document.getElementById('profileMenu');
profileButton.addEventListener('click',()=>{profileMenu.classList.toggle('open');profileButton.setAttribute('aria-expanded',profileMenu.classList.contains('open')?'true':'false')});
document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap')){profileMenu.classList.remove('open');profileButton.setAttribute('aria-expanded','false')}});
function setRole(nextRole){role=nextRole;profileMenu.classList.remove('open');profileButton.setAttribute('aria-expanded','false');document.getElementById('profileName').textContent=role==='warden'?'Warden Demo':'Student Demo';document.getElementById('profileRole').textContent=role==='warden'?'Warden / Admin view':'Student view';profileButton.textContent=role==='warden'?'W':'S';document.getElementById('studentViewButton').classList.toggle('selected',role==='student');document.getElementById('wardenViewButton').classList.toggle('selected',role==='warden');if(role==='warden'&&page==='raise')page='dashboard';go(page);toast(role==='warden'?'Warden demo view enabled.':'Student demo view enabled.')}
document.getElementById('studentViewButton').addEventListener('click',()=>setRole('student'));
document.getElementById('wardenViewButton').addEventListener('click',()=>setRole('warden'));
document.getElementById('resetDemoButton').addEventListener('click',()=>{if(confirm('Reset this browser demo to the original five sample complaints? Your added complaints will be removed.')){complaints=initial.slice();save();filters={search:'',status:'All Statuses',category:'All Categories'};profileMenu.classList.remove('open');go('dashboard');toast('Demo data reset to starter complaints.')}});
render();
</script>
</body>
</html>
